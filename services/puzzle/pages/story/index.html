<script>
  const mobileToggle = document.getElementById("mobile-nav-toggle");
  const mobileMenu = document.getElementById("mobile-nav-menu");
  if (mobileToggle && mobileMenu) {
    mobileToggle.onclick = () => mobileMenu.classList.toggle("hidden");
  }

  function keepTypingInView(element) {
    const rect = element.getBoundingClientRect();
    const viewportHeight = window.innerHeight || document.documentElement.clientHeight;
    const targetBottom = viewportHeight * 0.78;
    if (rect.bottom > targetBottom) {
      const delta = rect.bottom - targetBottom;
      window.scrollBy({ top: delta, behavior: "auto" });
    }
  }

  function typeText(element, text, speed = 35, onTick = null) {
    return new Promise((resolve) => {
      element.textContent = "";
      let index = 0;

      const timer = setInterval(() => {
        element.textContent += text[index];
        index += 1;
        if (typeof onTick === "function") onTick();

        if (index >= text.length) {
          clearInterval(timer);
          resolve();
        }
      }, speed);
    });
  }

  async function typeStoryContent(chapter) {
    const stageEl = document.getElementById("story-stage");
    if (stageEl) {
      stageEl.classList.remove("story-cinematic-on");
      void stageEl.offsetWidth;
      stageEl.classList.add("story-cinematic-on");
    }

    const storyElements = [
      { id: "story-paragraph-1", text: chapter.p1, speed: 60 },
      { id: "story-paragraph-2", text: chapter.p2, speed: 55 },
      { id: "story-paragraph-3", text: chapter.p3, speed: 75 },
      { id: "story-paragraph-4", text: chapter.p4, speed: 55 },
      { id: "story-highlight", text: chapter.highlight, speed: 62 }
    ];

    for (const item of storyElements) {
      const el = document.getElementById(item.id);
      if (!el) continue;
      await typeText(el, item.text || "", item.speed, () => keepTypingInView(el));
      keepTypingInView(el);
    }
  }

  function clearStoryContent() {
    const storyIds = [
      "story-paragraph-1",
      "story-paragraph-2",
      "story-paragraph-3",
      "story-paragraph-4",
      "story-highlight"
    ];

    for (const id of storyIds) {
      const el = document.getElementById(id);
      if (el) el.textContent = "";
    }
  }

  async function loadStoryChapter() {
    clearStoryContent();
    const chapterNumber = Number(new URLSearchParams(window.location.search).get("chapter")) || 1;
    const response = await fetch("./chapters.json");
    if (!response.ok) {
      throw new Error("Failed to load chapters.json");
    }
    const chapters = await response.json();
    const progress = await window.PuzzleState.getProgress();
    const allowedChapter = Math.min(Math.max(chapterNumber, 1), Math.max(progress.unlockedStory, 1));
    const chapter = chapters[String(allowedChapter)] || chapters["1"];
    const maxChapter = 5;

    if (allowedChapter !== chapterNumber) {
      window.location.replace(`./index.html?chapter=${allowedChapter}`);
      return;
    }

    document.getElementById("chapter-title").textContent = chapter.title;
    document.getElementById("chapter-badge").textContent = chapter.badge;
    const nextLink = document.getElementById("story-next-link");
    const nextText = document.getElementById("story-next-text");
    const prevLink = document.getElementById("story-prev-link");
    const prevText = document.getElementById("story-prev-text");

    if (allowedChapter <= 1) {
      prevLink.style.display = "none";
      prevLink.style.visibility = "hidden";
      prevLink.setAttribute("aria-hidden", "true");
      prevLink.setAttribute("tabindex", "-1");
      prevLink.onclick = null;
    } else {
      prevLink.style.display = "inline-flex";
      prevLink.style.visibility = "visible";
      prevLink.removeAttribute("aria-hidden");
      prevLink.removeAttribute("tabindex");
      prevLink.href = `./index.html?chapter=${allowedChapter - 1}`;
      prevText.textContent = `返回上一章（第 ${allowedChapter - 1} 章）`;
      prevLink.onclick = null;
    }

    if (allowedChapter <= 5) {
      nextLink.href = `../challenge/index.html?stage=${allowedChapter}`;
      nextText.textContent = `進入挑戰：第 ${allowedChapter} 關`;
      nextLink.onclick = async (event) => {
        event.preventDefault();
        try {
          await window.PuzzleState.updateProgress({
            unlockedStory: allowedChapter,
            unlockedChallenge: allowedChapter
          });
        } catch (_error) {
          // Ignore and continue navigation to avoid blocking user flow.
        }
        window.location.href = `../challenge/index.html?stage=${allowedChapter}`;
      };
    } else if (allowedChapter >= maxChapter) {
      nextLink.href = "../challenge_map/index.html";
      nextText.textContent = "前往關卡地圖";
      nextLink.onclick = null;
    } else {
      nextLink.href = "../challenge_map/index.html";
      nextText.textContent = "前往關卡地圖";
      nextLink.onclick = null;
    }

    // Apply visual/navigation state before typing animation starts.
    document.getElementById("story-image").src = chapter.image;
    document.getElementById("mission-text").textContent = chapter.mission;
    document.getElementById("tools-text").textContent = chapter.tools;
    document.getElementById("location-text").textContent = chapter.location;
    await typeStoryContent(chapter);
  }

  loadStoryChapter().catch(() => {
    document.getElementById("chapter-title").textContent = "故事載入失敗";
    document.getElementById("story-highlight").textContent = "請使用本機伺服器開啟頁面（例如 Live Server），不要直接以 file:// 開啟。";
  });
</script>
