<script>
  const mobileToggle = document.getElementById("mobile-nav-toggle");
  const mobileMenu = document.getElementById("mobile-nav-menu");
  if (mobileToggle && mobileMenu) {
    mobileToggle.onclick = () => mobileMenu.classList.toggle("hidden");
  }

  async function applyChallengeMapState() {
    const progress = await window.PuzzleState.getProgress();
    const unlocked = Math.min(Math.max(progress.unlockedChallenge, progress.unlockedStory - 1), 5);
    const progressText = document.querySelector("main .text-right span.block");
    if (progressText) {
      progressText.textContent = `${String(unlocked).padStart(2, "0")} / 05`;
    }

    const mapGrid = document.querySelector("main .grid");
    if (!mapGrid) return;
    const cards = Array.from(mapGrid.children).slice(0, 5);

    cards.forEach((card, index) => {
      const stage = index + 1;
      const isUnlocked = stage <= unlocked;
      const target = `../challenge/index.html?stage=${stage}`;
      const imageEl = card.querySelector("img");
      const imageWrapper = imageEl ? imageEl.parentElement : null;
      const lockIcon = Array.from(card.querySelectorAll(".material-symbols-outlined"))
        .find((el) => el.textContent.trim() === "lock" || el.textContent.trim() === "lock_open");
      const hintText = card.querySelector("p.text-sm, p.text-xs");
      const lockBadge = card.querySelector("div.text-\\[10px\\].tracking-widest");
      if (lockBadge) {
        lockBadge.style.display = "none";
      }

      if (isUnlocked) {
        card.classList.add("cursor-pointer");
        card.onclick = () => { window.location.href = target; };

        if (imageWrapper) {
          imageWrapper.classList.remove("grayscale", "opacity-40");
        }
        if (imageEl) {
          imageEl.classList.remove("grayscale", "opacity-40");
        }
        if (lockIcon) {
          lockIcon.textContent = "lock_open";
          lockIcon.classList.add("text-primary");
        }
        if (hintText) {
          hintText.textContent = "已解鎖，點擊前往";
        }
      } else {
        card.onclick = null;
        if (imageWrapper) {
          imageWrapper.classList.add("grayscale", "opacity-40");
        }
        if (imageEl) {
          imageEl.classList.add("grayscale", "opacity-40");
        }
        if (lockIcon) {
          lockIcon.textContent = "lock";
          lockIcon.classList.remove("text-primary");
        }
      }
    });
  }

  applyChallengeMapState();
</script>
